<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ken Priore">
  <title>Ken Priore</title>
  <!-- Loop house-mark: ink ring + one blue orbiting dot, on a white plate.
       The plate is deliberate. A #0A0A0A ring on a transparent ground scores
       1.00:1 against a dark browser tab strip, which is to say invisible.
       apple-touch-icon.png and kenpriore.ai/favicon.svg already plate to white.
       No width/height on purpose: the UA scales the viewBox into whatever box
       it needs. A fixed intrinsic size pins the render at 32 and clips.
       Self-contained: literal hex only, no currentColor, no classes, no refs. -->
  <rect width="32" height="32" fill="#FFFFFF"/>
  <circle cx="15" cy="16" r="9.5" fill="none" stroke="#0A0A0A" stroke-width="4"/>
  <circle cx="24.5" cy="16" r="3.8" fill="#0057B8"/>
</svg>
